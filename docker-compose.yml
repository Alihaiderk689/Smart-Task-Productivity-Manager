services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: alihaider310/taskflow-backend:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: alihaider310/taskflow-backend:latest
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    volumes:
      - backend_media:/app/media
    depends_on:
      - backend

  celery_beat:
    image: alihaider310/taskflow-backend:latest
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_ROOT: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    image: alihaider310/taskflow-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_media:
